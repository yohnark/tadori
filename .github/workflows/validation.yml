name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-test:
    name: Linux / Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: go test -count=1 -v ./...

  linux-vet:
    name: Linux / go vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go vet
        run: go vet ./...

  linux-race:
    name: Linux / race coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race-enabled core and integration tests
        run: >-
          go test -count=1 -race
          ./internal/diagnosis
          ./internal/integration
          ./internal/model
          ./internal/orchestrate
          ./internal/report
          ./internal/session
          ./internal/web

  frontend-syntax:
    name: Frontend / JavaScript validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript syntax
        run: |
          node --check internal/web/static/app.js
          node --check internal/web/static/composer.js
          node --check internal/web/static/display.js
      - name: Run deterministic frontend tests
        run: node --test internal/web/static/*.test.js

  windows-test:
    name: Windows / Go tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: go test -count=1 -v ./...

  windows-vet:
    name: Windows / go vet
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go vet
        run: go vet ./...

  windows-build:
    name: Windows / CLI build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the real CLI binary
        run: go build -trimpath -o tadori.exe ./cmd/tadori
